; Custom board: ESP32-S3 N16R8 + ST7789 1.44" + microSD + CC1101 + PN532(I2C)
; Build with:  pio run -e s3-n16r8-multitool

[env:s3-n16r8-multitool]
board = s3-n16r8-multitool
board_build.partitions = custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
build_src_filter =${env.build_src_filter} +<../boards/s3-n16r8-multitool>

build_flags =
	${env.build_flags}
	-Iboards/s3-n16r8-multitool
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_USB_MODE=1
	-DDEVICE_NAME='"S3-N16R8 MultiTool"'
	; TFT_eSPI drives the display through HSPI (= SPI2 on ESP32-S3)
	-D USE_HSPI_PORT=1
	; let the user pick any free GPIO for the optional IR/RF single-pin modules
	-DALLOW_ALL_GPIO_FOR_IR_RF=1

	; --- optional single-pin RF/IR modules (not used in the base build) ---
	-DRF_TX_PINS='{{"GPIO 1", 1}, {"GPIO 2", 2}, {"GPIO 18", 18}}'
	-DRF_RX_PINS='{{"GPIO 1", 1}, {"GPIO 2", 2}, {"GPIO 18", 18}}'
	-DIR_TX_PINS='{{"GPIO 1", 1}, {"GPIO 2", 2}, {"GPIO 18", 18}}'
	-DIR_RX_PINS='{{"GPIO 1", 1}, {"GPIO 2", 2}, {"GPIO 18", 18}}'

lib_deps =
	${env.lib_deps}


; ==========================================================================
;  换屏用的编译环境
;  接线完全相同，只是换一个屏幕档案重新编译，产物在
;  .pio/build/<env>/firmware.bin 以及根目录 Bruce-<env>.bin
; ==========================================================================

; 1.3" ST7789 240x240
[env:s3-n16r8-screen-240]
extends = env:s3-n16r8-multitool
build_flags = ${env:s3-n16r8-multitool.build_flags} -DSCREEN_ST7789_240

; 2.0" ST7789 240x320
[env:s3-n16r8-screen-240x320]
extends = env:s3-n16r8-multitool
build_flags = ${env:s3-n16r8-multitool.build_flags} -DSCREEN_ST7789_240X320

; 1.8" ST7735 128x160
[env:s3-n16r8-screen-7735-160]
extends = env:s3-n16r8-multitool
build_flags = ${env:s3-n16r8-multitool.build_flags} -DSCREEN_ST7735_128X160

; 0.96" ST7735 80x160
[env:s3-n16r8-screen-7735-80]
extends = env:s3-n16r8-multitool
build_flags = ${env:s3-n16r8-multitool.build_flags} -DSCREEN_ST7735_80X160

; 2.8" ILI9341 240x320
[env:s3-n16r8-screen-ili9341]
extends = env:s3-n16r8-multitool
build_flags = ${env:s3-n16r8-multitool.build_flags} -DSCREEN_ILI9341_240X320

